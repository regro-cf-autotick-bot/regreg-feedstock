{% set name = "regreg" %}
{% set version = "0.2.0" %}
{% set sha256 = "e43865deec61f9e52d2dde6c2efd98e550659a3786ccf9493d56ac6da8420774" %}

package:
  name: regreg
  version: {{ version }}

source:
  url: https://github.com/regreg/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  skip: true  # [py<=36]
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - pip
    - python
    - numpy >=1.7.1
    - cython >=0.18
  run:
    - python
    - {{ pin_compatible('numpy') }}
    - scipy >=0.16.0
    - joblib >=0.15.1

test:
  imports:
    - regreg.api

about:
  home: https://github.com/regreg/regreg
  summary: A library for regularized regression
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jonathan-taylor
